<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#005b38"><title>Metode Belajar Privat yang Cocok untuk Anak — Tutorin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"><style>:root{--g:#005b38;--l:#e8f5ed;--gold:#f4c51b;--text:#123d2b;--muted:#63756c}*{box-sizing:border-box}body{margin:0;background:#f6faf7;color:var(--text);font-family:'DM Sans',sans-serif}.wrap{width:min(820px,calc(100% - 24px));margin:auto}.top{height:64px;background:#fff;border-bottom:1px solid #d8e5dc;display:flex;align-items:center}.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px;font:800 18px 'Plus Jakarta Sans'}.mark{width:31px;height:31px;border-radius:9px;background:var(--g);color:#fff;display:grid;place-items:center}.back{font-size:13px;font-weight:700;color:#507165}.main{padding:32px 0 70px}.intro{text-align:center;max-width:680px;margin:0 auto 25px}.k{font-size:11px;color:#087044;font-weight:800;letter-spacing:.08em}.intro h1{font:800 clamp(32px,6vw,48px)/1.1 'Plus Jakarta Sans';margin:9px 0 12px;letter-spacing:-.03em}.intro p,.help,.panel p{color:var(--muted);line-height:1.7}.meta{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:15px}.meta span,.tag{background:var(--l);color:#256044;border-radius:99px;padding:7px 10px;font-size:11px;font-weight:700}.card,.panel{background:#fff;border:1px solid #d7e5dc;border-radius:22px;padding:24px;box-shadow:0 14px 36px rgba(5,66,39,.06)}.progress{height:7px;background:#e2eee6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#087044;width:0}.row{display:flex;justify-content:space-between;color:#708078;font-size:12px;margin:8px 0 22px}.qk{font-size:10px;color:#087044;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.card h2{font:800 clamp(25px,5vw,36px)/1.2 'Plus Jakarta Sans';margin:8px 0}.opts{display:grid;gap:10px;margin-top:18px}.opt{border:1px solid #ceddd4;background:#fff;border-radius:14px;padding:15px;text-align:left;font:600 14px/1.45 'DM Sans';color:#25483a;cursor:pointer}.opt.sel{background:var(--l);border-color:#087044;box-shadow:0 0 0 2px rgba(8,112,68,.08)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:0;border-radius:13px;padding:13px 17px;font-weight:800;cursor:pointer}.sec{background:#edf5f0;color:#35614e}.pri{background:var(--gold);color:var(--text)}button:disabled{opacity:.4}.result{text-align:center}.result h1{font:800 clamp(30px,6vw,46px)/1.1 'Plus Jakarta Sans';margin:9px 0}.result>p{color:var(--muted);line-height:1.7;max-width:650px;margin:auto}.grid{display:grid;gap:14px;margin-top:22px;text-align:left}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.ra{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.ra a{min-height:47px;padding:0 17px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800}.wa{background:var(--gold)}.home{background:#edf5f0}.hide{display:none!important}@media(max-width:600px){.main{padding:24px 0 55px}.card,.panel{padding:19px;border-radius:19px}.actions{position:sticky;bottom:7px;background:rgba(246,250,247,.95);padding-top:9px}.actions .btn{flex:1}.ra{flex-direction:column}.ra a{width:100%}}</style></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html"><span class="mark">T</span>Tutorin</a><a class="back" href="assessment.html">← Pilih asesmen</a></div></header><main class="main"><div class="wrap"><section id="intro" class="intro"><span class="k">ASESMEN METODE BELAJAR</span><h1>Metode Belajar Privat yang Cocok untuk Anak</h1><p>Pemetaan singkat untuk melihat pendekatan belajar yang cenderung paling sesuai dengan cara anak belajar.</p><div class="meta"><span>Gratis</span><span>±4–5 menit</span><span>Hasil langsung</span></div></section><section id="flow" class="card"><div class="progress"><i id="bar"></i></div><div class="row"><span id="step"></span><span id="pct"></span></div><div class="qk" id="qk"></div><h2 id="qt"></h2><p class="help">Pilih jawaban yang paling menggambarkan kondisi anak saat ini.</p><div class="opts" id="opts"></div><div class="actions"><button class="btn sec" id="prev">Kembali</button><button class="btn pri" id="next">Lanjut →</button></div></section><section id="result" class="result hide"></section></div></main><script>const qs=[['Instruksi','Saat mempelajari materi baru, biasanya saya paling terbantu ketika...',['Bisa mencoba sendiri setelah penjelasan singkat','Melihat contoh soal terlebih dahulu','Mendapat beberapa contoh dan penjelasan','Mendapat arahan langkah demi langkah','Mendapat pertanyaan yang menantang saya untuk berpikir'],['independent','example','example','structured','socratic']],['Instruksi','Saat mendapat soal baru, saya biasanya...',['Langsung mencoba dengan strategi sendiri','Mencari contoh soal yang mirip','Membaca kembali contoh atau penjelasan','Menunggu arahan langkah pertama','Mulai dengan bertanya tentang cara berpikirnya'],['independent','example','example','structured','socratic']],['Bantuan','Saat tidak bisa mengerjakan soal, saya lebih terbantu jika...',['Diberi sedikit petunjuk','Diberikan contoh soal serupa','Dijelaskan kembali konsepnya','Didampingi langkah demi langkah','Diberi waktu mencoba lebih lama sebelum dibantu'],['hint','example','reteach','step','wait']],['Bantuan','Ketika saya bingung harus mulai dari mana, tutor sebaiknya...',['Memberi satu petunjuk kecil','Menunjukkan contoh yang mirip','Mengulang konsep yang menjadi dasar soal','Membantu menentukan langkah pertama','Mengajukan pertanyaan agar saya menemukan langkahnya'],['hint','example','reteach','step','socratic']],['Transfer','Setelah melihat contoh soal, biasanya saya...',['Bisa langsung mengerjakan soal serupa','Bisa setelah sedikit diarahkan','Membutuhkan beberapa contoh lagi','Masih kesulitan memulai','Lebih suka langsung mencoba soal yang menantang'],['transfer','guided','example','structured','challenge']],['Feedback','Ketika jawaban saya salah, saya paling terbantu jika...',['Mencari sendiri letak kesalahan','Diberi petunjuk untuk memperbaikinya','Mendapat penjelasan kesalahannya','Membahas langkahnya bersama tutor','Mencoba tantangan lain dengan konsep yang sama'],['selfcheck','hint','explain','discuss','retry']],['Kemandirian','Saat mengerjakan latihan tanpa bantuan tutor, saya...',['Bisa menyelesaikannya sendiri','Bisa jika ada contoh/checklist','Bisa setelah latihan bertahap','Sering membutuhkan arahan','Suka mencoba beberapa strategi sendiri'],['independent','checklist','scaffold','help','challenge']],['Tantangan','Ketika mendapat soal yang lebih sulit, saya...',['Merasa tertantang','Tetap mencoba tetapi perlu dorongan','Lebih cepat meminta bantuan','Membutuhkan struktur langkah demi langkah','Mudah kehilangan motivasi'],['challenge','confidence','help','structured','confidence']],['Koreksi','Setelah mengetahui jawaban saya salah, biasanya saya...',['Ingin mencari sendiri penyebabnya','Mencoba lagi setelah mendapat petunjuk','Membutuhkan penjelasan ulang','Ingin membahas langkahnya bersama tutor','Lebih suka mencoba soal lain lalu kembali lagi'],['selfcheck','hint','reteach','discuss','retry']],['Pemantauan','Agar saya tahu sudah benar-benar memahami materi, saya paling terbantu dengan...',['Mencoba menjelaskan kembali tanpa melihat catatan','Mengerjakan beberapa soal serupa','Mengerjakan latihan dari mudah ke sulit','Mendapat checklist penguasaan materi','Mengerjakan soal aplikasi yang menantang'],['selfexplain','practice','scaffold','checklist','challenge']],['Kemandirian','Setelah sesi tutor selesai, saya lebih nyaman jika...',['Mendapat target belajar yang jelas','Mendapat contoh dan checklist','Mendapat latihan bertahap','Mendapat evaluasi progres','Mendapat soal tantangan untuk dikerjakan sendiri'],['target','checklist','scaffold','monitor','challenge']],['Tantangan','Jika materi sudah mulai dikuasai, saya lebih berkembang ketika tutor...',['Memberi kesempatan saya bekerja lebih mandiri','Menambah latihan dengan variasi soal','Menguji pemahaman saya dengan pertanyaan','Mendorong saya menjelaskan strategi','Memberikan masalah yang lebih menantang'],['independent','practice','socratic','selfexplain','challenge']]];let i=0,a=[],$=x=>document.getElementById(x);function render(){let q=qs[i],p=Math.round((i+1)/qs.length*100);$('step').textContent=`Pertanyaan ${i+1} dari ${qs.length}`;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('qk').textContent=q[0];$('qt').textContent=q[1];$('opts').innerHTML=q[2].map((x,n)=>`<button class="opt ${a[i]===n?'sel':''}" data-n="${n}">${x}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{a[i]=+b.dataset.n;render()});$('prev').disabled=i===0;$('next').disabled=a[i]===undefined;$('next').textContent=i===qs.length-1?'Lihat Hasil →':'Lanjut →';scrollTo(0,0)}function result(){let codes=a.map((v,i)=>qs[i][3][Number(v)]),count=c=>codes.filter(x=>x===c).length,p=count('structured')+count('step')+count('reteach')+count('example')>=4?'structured':count('confidence')+count('help')>=2?'confidence':count('challenge')+count('target')+count('monitor')+count('independent')>=4?'challenge':count('socratic')+count('selfexplain')+count('discuss')>=3?'active':'guided',P={structured:['Pembelajaran Terstruktur','Penjelasan jelas, contoh konkret, dan urutan langkah yang terarah.','Jelaskan → contoh → latihan bertahap'],guided:['Guided Practice','Kesempatan mencoba sendiri dengan petunjuk saat buntu.','Coba → petunjuk → coba lagi → feedback'],confidence:['Structured & Confidence Building','Struktur jelas dan peningkatan kesulitan bertahap agar tetap percaya diri.','Easy win → guided practice → gradual challenge'],active:['Active & Socratic Learning','Pertanyaan, diskusi, dan kesempatan menjelaskan cara berpikir.','Pertanyaan → berpikir → menjelaskan → feedback'],challenge:['Independent & Challenge-Based','Target jelas, ruang eksplorasi, dan soal yang menantang.','Challenge → eksplorasi → feedback → mastery']}[p];$('flow').classList.add('hide');$('intro').classList.add('hide');$('result').classList.remove('hide');$('result').innerHTML=`<div class="intro"><span class="k">HASIL ASESMEN</span><h1>${P[0]}</h1><p>${P[1]}</p></div><div class="grid"><section class="panel"><h3>Protocol belajar yang disarankan</h3><p><strong>${P[2]}</strong></p><div class="tags"><span class="tag">Feedback</span><span class="tag">Kemandirian</span><span class="tag">Tantangan</span></div></section><section class="panel"><h3>Langkah berikutnya</h3><p>Gunakan hasil ini sebagai bahan diskusi dengan Tutorin. Hasil asesmen adalah screening awal, bukan diagnosis.</p><div class="ra"><a class="wa" target="_blank" href="https://wa.me/6283155365009?text=Halo%20Tutorin,%20saya%20sudah%20mengisi%20asesmen%20metode%20belajar.%20Saya%20ingin%20konsultasi%20mengenai%20hasilnya.">Konsultasi via WhatsApp →</a><a class="home" href="index.html">Kembali ke Home</a></div></section></div>`;scrollTo(0,0)}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(a[i]===undefined)return;if(i<qs.length-1){i++;render()}else result()};render();</script></body></html>
