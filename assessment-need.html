</style></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html"><span class="mark">T</span>Tutorin</a><a class="back" href="assessment.html">← Pilih asesmen</a></div></header><main class="main"><div class="wrap"><section id="intro" class="intro"><span class="k">ASESMEN KEBUTUHAN</span><h1>Apakah anak membutuhkan les privat?</h1><p>Jawab berdasarkan kondisi anak saat ini. Tidak ada jawaban benar atau salah.</p><div class="meta"><span>✦ Gratis</span><span>⚡ ±3–4 menit</span><span>✓ Hasil langsung</span></div></section><section id="flow" class="card"><div class="progress-wrap"><div class="progress"><i id="bar"></i></div><span class="progress-pct" id="pct">10%</span></div><div class="row"><span id="step"></span><span>Screening awal</span></div><span class="qk" id="qk"></span><h2 id="qt"></h2><p class="help">Pilih jawaban yang paling menggambarkan kondisi anak.</p><div class="opts" id="opts"></div><div class="actions"><button class="btn sec" id="prev">← Kembali</button><button class="btn pri" id="next">Lanjut →</button></div></section><section id="result" class="result hide"></section></div></main><script>const qs=[['Akademik','Seberapa sering anak kesulitan memahami materi sekolah meskipun sudah dijelaskan?',['Jarang','Kadang-kadang','Cukup sering','Sering sekali']],['Akademik','Bagaimana pencapaian nilai anak dibandingkan target yang diharapkan?',['Sesuai/di atas target','Sedikit di bawah target','Cukup jauh di bawah target','Jauh di bawah target']],['Kemandirian','Saat belajar sendiri, anak biasanya...',['Bisa mengatur dan menyelesaikan sendiri','Bisa tetapi sesekali perlu diarahkan','Sering membutuhkan bantuan','Sulit memulai atau menyelesaikan tanpa didampingi']],['Konsistensi','Seberapa konsisten anak memiliki waktu belajar di rumah?',['Konsisten','Cukup konsisten','Sering tidak konsisten','Hampir tidak punya pola belajar']],['Hambatan','Ketika menemukan soal atau materi yang sulit, anak cenderung...',['Mencoba strategi lain sendiri','Mencoba lalu meminta sedikit bantuan','Cepat meminta bantuan','Menghindari atau menyerah']],['Fokus','Saat belajar, seberapa sering anak kehilangan fokus sebelum tugas selesai?',['Jarang','Kadang-kadang','Cukup sering','Sering']],['Target','Apakah anak memiliki target akademik tertentu?',['Tidak ada kebutuhan khusus','Ada target peningkatan nilai','Ada target ujian/TKA/kompetisi','Ada target besar seperti OSN atau PTN tertentu']],['Pendampingan','Jika ada tutor, kebutuhan utama anak menurut Anda adalah...',['Sesekali membantu materi tertentu','Pendampingan rutin pada beberapa pelajaran','Pendampingan terstruktur dan monitoring','Pendampingan intensif dengan target yang jelas']],['Orang Tua','Seberapa sulit bagi orang tua mengetahui apakah proses belajar anak benar-benar berkembang?',['Tidak sulit','Agak sulit','Cukup sulit','Sangat sulit']],['Urgensi','Dalam 1–3 bulan ke depan, seberapa penting perbaikan/pendampingan belajar bagi anak?',['Belum menjadi prioritas','Cukup penting','Penting','Sangat penting']]];let i=0,a=[],$=x=>document.getElementById(x);function render(){let q=qs[i],p=Math.round((i+1)/qs.length*100);$('step').textContent=`Pertanyaan ${i+1} dari ${qs.length}`;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('qk').textContent=q[0];$('qt').textContent=q[1];$('opts').innerHTML=q[2].map((x,n)=>`<button class="opt ${a[i]===n?'sel':''}" data-n="${n}">${x}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{a[i]=+b.dataset.n;render()});$('prev').disabled=i===0;$('next').disabled=a[i]===undefined;$('next').textContent=i===qs.length-1?'Lihat Hasil →':'Lanjut →';window.scrollTo({top:0,behavior:'smooth'})}function result(){let s=a.reduce((x,v)=>x+v,0),level=s<=8?['Anak relatif mampu belajar mandiri','Les privat belum tentu menjadi kebutuhan rutin. Fokus awal bisa diarahkan pada rutinitas, target, dan bantuan pada materi tertentu.','Pendampingan selektif bila diperlukan']:s<=18?['Anak berpotensi terbantu dengan pendampingan','Pendampingan pada materi atau target tertentu dapat membantu jika diberikan secara terarah dan dievaluasi berkala.','Privat terarah & rutin sesuai target']:['Anak berpotensi mendapat manfaat besar dari privat','Kombinasi kesulitan, kebutuhan pendampingan, dan target menunjukkan privat terstruktur berpotensi memberi manfaat besar.','Privat personal & terstruktur'];let score=Math.min(96,Math.round(42+s*5));$('flow').classList.add('hide');$('intro').classList.add('hide');$('result').classList.remove('hide');$('result').innerHTML=`<div class="result-score"><strong>${score}%</strong></div><section class="intro"><span class="k">HASIL SCREENING</span><h1>${level[0]}</h1><p class="result-lead">${level[1]}</p></section><div class="result-grid"><section class="panel"><h3>Rekomendasi awal</h3><p><strong>${level[2]}</strong></p><div class="tags"><span class="tag">Pemahaman</span><span class="tag">Kemandirian</span><span class="tag">Kebiasaan</span><span class="tag">Fokus</span></div></section><section class="panel accent"><h3>Langkah berikutnya</h3><p>Hasil ini paling berguna jika dibahas bersama Tutorin untuk melihat kebutuhan, target, dan kecocokan tutor anak.</p><div class="actions-result"><a class="wa" target="_blank" href="https://wa.me/6283155365009?text=Halo%20Tutorin,%20saya%20sudah%20mengisi%20asesmen%20kebutuhan%20les%20privat.%20Saya%20ingin%20konsultasi%20hasilnya.">Konsultasi via WhatsApp →</a><a class="home" href="assessment.html">Asesmen lain</a></div></section></div>`;window.scrollTo({top:0,behavior:'smooth'})}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(a[i]===undefined)return;if(i<qs.length-1){i++;render()}else result()};render();</script></body></html>
