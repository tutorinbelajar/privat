name: Finalize dedicated assessment UX
on:
  push:
    branches: [feat/two-dedicated-assessment-pages]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Home assessment links and router
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('href="#assessment"','href="assessment.html"')
          s=s.replace('href="#need"','href="assessment-need.html"')
          s=s.replace('href="#method"','href="assessment-method.html"')
          p.write_text(s)
          PY
          cat > app.js <<'JS'
const WA='6283155365009';
const goNeed=()=>window.location.href='assessment-need.html';
const goMethod=()=>window.location.href='assessment-method.html';
const goAssessment=()=>window.location.href='assessment.html';
window.startNeedAssessment=goNeed;
window.startMethodAssessment=goMethod;
window.home=()=>window.location.href='index.html';
window.show=()=>{};
document.addEventListener('click',e=>{
  const a=e.target.closest('a'); if(!a) return;
  const h=a.getAttribute('href');
  if(h==='#assessment'){e.preventDefault();goAssessment();}
  if(h==='#need'){e.preventDefault();goNeed();}
  if(h==='#method'){e.preventDefault();goMethod();}
});
JS
          rm -f .github/workflows/finalize-assessment-ux.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js .github/workflows/finalize-assessment-ux.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Wire Home to dedicated assessment pages'
          git push
