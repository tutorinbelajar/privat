name: Inject Tutorin Assessment AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify assessment AI wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('assessment-need.html', 'assessment-method.html'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if not re.search(r'<script\\s+src=["\\']assessment-ai\\.js(?:\\?[^"\\']*)?["\\']\\s*></script>', text):
                  raise SystemExit(f'Missing assessment-ai.js tag in {name}')
          p = Path('assessment-method.html')
          text = p.read_text(encoding='utf-8')
          if 'tutorin:assessment-complete' not in text:
              raise SystemExit('Missing assessment completion event in assessment-method.html')
          p = Path('assessment-ai.js')
          text = p.read_text(encoding='utf-8')
          if "tutorin:assessment-complete" not in text or "fetch(ENDPOINT" not in text:
              raise SystemExit('Assessment AI client is not wired correctly')
          print('Assessment AI wiring OK')
          PY
