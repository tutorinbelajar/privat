name: Inject Tutorin Assessment AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject AI client
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script src="assessment-ai.js"></script>'
          for name in ('assessment-need.html', 'assessment-method.html'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if tag not in text:
                  marker = '</body>'
                  if marker not in text:
                      raise SystemExit(f'Missing {marker} in {name}')
                  p.write_text(text.replace(marker, tag + marker), encoding='utf-8')
          PY
      - name: Commit injected pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessment-need.html assessment-method.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Inject assessment AI client into assessment pages'
            git push
          fi
