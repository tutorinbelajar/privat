name: Inject Tutorin Assessment AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make assessment AI-first
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tag = '<script src="assessment-ai.js?v=20260904-3"></script>'
          pattern = r'<script\s+src=["\']assessment-ai\.js(?:\?[^"\']*)?["\']\s*></script>'

          # Always use a fresh client version and make the method result a pure AI handoff.
          for name in ('assessment-need.html', 'assessment-method.html'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = re.sub(pattern, tag, text)
              if tag not in text:
                  text = text.replace('</body>', tag + '</body>', 1)
              p.write_text(text, encoding='utf-8')

          p = Path('assessment-method.html')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              start = text.find('function result(){')
              end = text.find("\n $('next').onclick=", start)
              if start >= 0 and end > start:
                  replacement = """function result(){
          $('flow').classList.add('hide');
          $('intro').classList.add('hide');
          $('result').classList.remove('hide');
          $('result').innerHTML='<section class=\"panel ai-loading-host\"><span class=\"k\">HASIL PEMETAAN CARA BELAJAR</span><h1>Menganalisis pola belajar anak…</h1><p class=\"result-lead\">Tutorin sedang membaca seluruh 12 jawaban dan hubungan antarjawabannya untuk menyusun rekomendasi yang lebih personal.</p></section>';
          window.dispatchEvent(new Event('tutorin:assessment-complete'));
          }"""
                  text = text[:start] + replacement + text[end:]
                  p.write_text(text, encoding='utf-8')

          # Make the AI client react to the explicit completion event instead of relying only on DOM timing.
          p = Path('assessment-ai.js')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              marker = "  window.TutorinAssessmentAI={runAI,ENDPOINT};"
              hook = "  window.addEventListener('tutorin:assessment-complete', () => requestForPage(true));"
              if hook not in text and marker in text:
                  text = text.replace(marker, hook + '\n' + marker, 1)
                  p.write_text(text, encoding='utf-8')
          PY
      - name: Commit AI-first assessment changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessment-need.html assessment-method.html assessment-ai.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Make method assessment AI-first'
            git push
          fi
