name: Inject Tutorin Assessment AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject AI client with cache busting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tag = '<script src="assessment-ai.js?v=20260904-2"></script>'
          pattern = r'<script\s+src=["\']assessment-ai\.js(?:\?[^"\']*)?["\']\s*></script>'

          for name in ('assessment-need.html', 'assessment-method.html'):
              p = Path(name)
              if not p.exists():
                  continue

              text = p.read_text(encoding='utf-8')
              updated = re.sub(pattern, tag, text)

              if tag not in updated:
                  marker = '</body>'
                  if marker not in updated:
                      raise SystemExit(f'Missing {marker} in {name}')
                  updated = updated.replace(marker, tag + marker, 1)

              if updated != text:
                  p.write_text(updated, encoding='utf-8')
          PY
      - name: Commit injected pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessment-need.html assessment-method.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Cache bust assessment AI client'
            git push
          fi
