name: Inject Tutorin Assessment AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wire assessment result actions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assessment-method.html')
          if not p.exists():
              raise SystemExit('assessment-method.html not found')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="assessment-result-actions.js?v=20260904-1"></script>'
          if 'assessment-result-actions.js' not in text:
              text = text.replace('</body>', tag + '</body>')
              p.write_text(text, encoding='utf-8')
              print('Added assessment-result-actions.js')
          else:
              print('assessment-result-actions.js already wired')
          
          ai = Path('assessment-ai.js').read_text(encoding='utf-8')
          if 'tutorin:assessment-complete' not in ai or 'fetch(ENDPOINT' not in ai:
              raise SystemExit('Assessment AI client wiring check failed')
          
          method = p.read_text(encoding='utf-8')
          if 'assessment-result-actions.js' not in method:
              raise SystemExit('Result actions script was not wired')
          print('Assessment result actions wiring OK')
          PY
      - name: Commit wiring if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit'
          else
            git add assessment-method.html
            git commit -m 'Wire assessment result actions [skip ci]'
            git push
          fi
