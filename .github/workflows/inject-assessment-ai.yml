name: Inject Tutorin Assessment AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wire assessment persistence
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ('assessment-method.html', 'assessment-need.html'):
              p = Path(filename)
              if not p.exists():
                  raise SystemExit(f'{filename} not found')
              text = p.read_text(encoding='utf-8')
              tag = '<script src="assessment-persistence.js?v=20260904-1"></script>'
              if 'assessment-persistence.js' not in text:
                  text = text.replace('</body>', tag + '</body>')
                  p.write_text(text, encoding='utf-8')
                  print(f'Added persistence to {filename}')
              else:
                  print(f'Persistence already wired in {filename}')

          persistence = Path('assessment-persistence.js')
          if not persistence.exists():
              raise SystemExit('assessment-persistence.js not found')
          print('Assessment persistence wiring OK')
          PY
      - name: Simplify homepage final CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')
          text = p.read_text(encoding='utf-8')
          pattern = r'(<h[1-6][^>]*>\s*Belum yakin harus mulai dari mana\?\s*</h[1-6]>.*?)(<div[^>]*class="[^"]*actions[^"]*"[^>]*>)(.*?)(</div>)'
          match = re.search(pattern, text, flags=re.I | re.S)
          if match:
              actions = match.group(3)
              actions = re.sub(r'<a\b[^>]*>\s*Cek kebutuhan anak\s*</a>\s*', '', actions, flags=re.I | re.S)
              replacement = match.group(1) + match.group(2) + actions + match.group(4)
              text = text[:match.start()] + replacement + text[match.end():]
              p.write_text(text, encoding='utf-8')
              print('Removed Cek kebutuhan anak from final CTA')
          else:
              print('Final CTA structure not found; leaving homepage unchanged')
          PY
      - name: Commit wiring if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit'
          else
            git add assessment-method.html assessment-need.html index.html
            git commit -m 'Simplify homepage final consultation CTA [skip ci]'
            git push
          fi
