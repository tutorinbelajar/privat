name: Inject Tutorin Assessment AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wire assessment persistence
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ('assessment-method.html', 'assessment-need.html'):
              p = Path(filename)
              if not p.exists():
                  raise SystemExit(f'{filename} not found')
              text = p.read_text(encoding='utf-8')
              tag = '<script src="assessment-persistence.js?v=20260904-1"></script>'
              if 'assessment-persistence.js' not in text:
                  text = text.replace('</body>', tag + '</body>')
                  p.write_text(text, encoding='utf-8')
                  print(f'Added persistence to {filename}')
              else:
                  print(f'Persistence already wired in {filename}')

          persistence = Path('assessment-persistence.js')
          if not persistence.exists():
              raise SystemExit('assessment-persistence.js not found')
          print('Assessment persistence wiring OK')
          PY
      - name: Commit wiring if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit'
          else
            git add assessment-method.html assessment-need.html
            git commit -m 'Wire assessment persistence [skip ci]'
            git push
          fi
